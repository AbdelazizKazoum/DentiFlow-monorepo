name: dentiflow-prod

networks:
  dentiflow-network:
    driver: bridge

volumes:
  db_data:

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}}

x-migration-env: &migration-env
  <<: *db-env
  TS_NODE_TRANSPILE_ONLY: "true"

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - dentiflow-network

services:
  nats:
    image: nats:2.10-alpine
    <<: *service-common
    command: ["-m", "8222"]
    expose:
      - "4222"
      - "8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: mysql:8.0
    <<: *service-common
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-bootstrap:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: >
      sh -c 'mysql -h db -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "
      CREATE DATABASE IF NOT EXISTS auth_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS clinic_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS patient_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS appointment_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS treatment_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      GRANT ALL PRIVILEGES ON auth_db.* TO '\''root'\''@'\''%'\'';
      GRANT ALL PRIVILEGES ON clinic_db.* TO '\''root'\''@'\''%'\'';
      GRANT ALL PRIVILEGES ON patient_db.* TO '\''root'\''@'\''%'\'';
      GRANT ALL PRIVILEGES ON appointment_db.* TO '\''root'\''@'\''%'\'';
      GRANT ALL PRIVILEGES ON treatment_db.* TO '\''root'\''@'\''%'\'';
      FLUSH PRIVILEGES;"'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dentiflow-network

  auth-migrations:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      <<: *migration-env
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      TS_NODE_PROJECT: auth-service/tsconfig.json
      DENTIFLOW_SEED_DEFAULT_ADMIN: ${DENTIFLOW_SEED_DEFAULT_ADMIN:-true}
      DEFAULT_ADMIN_CLINIC_ID: ${DEFAULT_ADMIN_CLINIC_ID:-00000000-0000-4000-8000-000000000001}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@dentiflow.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin123!}
      DEFAULT_ADMIN_FULL_NAME: ${DEFAULT_ADMIN_FULL_NAME:-DentiFlow Admin}
    command: >
      node -r ts-node/register -r tsconfig-paths/register
      node_modules/typeorm/cli.js migration:run
      -d auth-service/src/infrastructure/persistence/data-source.ts
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - dentiflow-network

  clinic-migrations:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      <<: *migration-env
      DB_NAME: ${CLINIC_DB_NAME:-clinic_db}
      TS_NODE_PROJECT: clinic-service/tsconfig.json
    command: >
      node -r ts-node/register -r tsconfig-paths/register
      node_modules/typeorm/cli.js migration:run
      -d clinic-service/src/infrastructure/persistence/data-source.ts
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      auth-migrations:
        condition: service_completed_successfully
    networks:
      - dentiflow-network

  patient-migrations:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      <<: *migration-env
      DB_NAME: ${PATIENT_DB_NAME:-patient_db}
      TS_NODE_PROJECT: patient-service/tsconfig.json
    command: >
      node -r ts-node/register -r tsconfig-paths/register
      node_modules/typeorm/cli.js migration:run
      -d patient-service/src/infrastructure/persistence/data-source.ts
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      clinic-migrations:
        condition: service_completed_successfully
    networks:
      - dentiflow-network

  appointment-migrations:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      <<: *migration-env
      DB_NAME: ${APPOINTMENT_DB_NAME:-appointment_db}
      TS_NODE_PROJECT: appointment-service/tsconfig.json
    command: >
      node -r ts-node/register -r tsconfig-paths/register
      node_modules/typeorm/cli.js migration:run
      -d appointment-service/src/infrastructure/persistence/data-source.ts
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      patient-migrations:
        condition: service_completed_successfully
    networks:
      - dentiflow-network

  treatment-migrations:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      <<: *migration-env
      DB_NAME: ${TREATMENT_DB_NAME:-treatment_db}
      TS_NODE_PROJECT: treatment-service/tsconfig.json
    command: >
      node -r ts-node/register -r tsconfig-paths/register
      node_modules/typeorm/cli.js migration:run
      -d treatment-service/src/infrastructure/persistence/data-source.ts
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      appointment-migrations:
        condition: service_completed_successfully
    networks:
      - dentiflow-network

  auth-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-auth-service:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-604800}
      GRPC_PORT: 5001
    expose:
      - "3002"
      - "5001"
    depends_on:
      auth-migrations:
        condition: service_completed_successfully

  clinic-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-clinic-service:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_NAME: ${CLINIC_DB_NAME:-clinic_db}
      GRPC_PORT: 5002
      AUTH_SERVICE_GRPC_URL: auth-service:5001
    expose:
      - "3003"
      - "5002"
    depends_on:
      clinic-migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  patient-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-patient-service:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_NAME: ${PATIENT_DB_NAME:-patient_db}
      GRPC_PORT: 5003
    expose:
      - "3004"
      - "5003"
    depends_on:
      patient-migrations:
        condition: service_completed_successfully

  appointment-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-appointment-service:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3005
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_NAME: ${APPOINTMENT_DB_NAME:-appointment_db}
      GRPC_PORT: 5004
      PATIENT_SERVICE_GRPC_URL: patient-service:5003
      CLINIC_SERVICE_GRPC_URL: clinic-service:5002
      NATS_URL: nats://nats:4222
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
    expose:
      - "3005"
      - "5004"
    depends_on:
      appointment-migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      patient-service:
        condition: service_started
      clinic-service:
        condition: service_started

  treatment-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-treatment-service:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3006
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_NAME: ${TREATMENT_DB_NAME:-treatment_db}
      GRPC_PORT: 5005
      NATS_URL: nats://nats:4222
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
    expose:
      - "3006"
      - "5005"
    depends_on:
      treatment-migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  api-gateway:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-api-gateway:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      AUTH_SERVICE_URL: http://auth-service:3002
      AUTH_SERVICE_GRPC_URL: auth-service:5001
      CLINIC_SERVICE_GRPC_URL: clinic-service:5002
      PATIENT_SERVICE_GRPC_URL: patient-service:5003
      APPOINTMENT_SERVICE_GRPC_URL: appointment-service:5004
      TREATMENT_SERVICE_GRPC_URL: treatment-service:5005
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NATS_URL: nats://nats:4222
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${PROD_API_PORT:-3001}:3001"
    depends_on:
      auth-service:
        condition: service_started
      clinic-service:
        condition: service_started
      patient-service:
        condition: service_started
      appointment-service:
        condition: service_started
      treatment-service:
        condition: service_started
      nats:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/dentiflow-frontend:${IMAGE_TAG:-latest}
    <<: *service-common
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      NEXTAUTH_SESSION_COOKIE_NAME: ${NEXTAUTH_SESSION_COOKIE_NAME:-dentiflow-prod.session-token}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_DEFAULT_CLINIC_ID: ${NEXT_PUBLIC_DEFAULT_CLINIC_ID:-00000000-0000-4000-8000-000000000001}
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${PROD_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_started
