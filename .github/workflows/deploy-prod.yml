name: Build and Deploy Production

on:
  push:
    branches:
      - main
      - feature/treatment-imp
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: abdelazizkazoum2
  PROD_NEXT_PUBLIC_API_URL: ${{ vars.PROD_NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
  PROD_NEXT_PUBLIC_DEFAULT_CLINIC_ID: ${{ vars.PROD_NEXT_PUBLIC_DEFAULT_CLINIC_ID || '00000000-0000-4000-8000-000000000001' }}

jobs:
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile.migrations
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-migrations:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-migrations:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile

      - name: Build and push auth service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-auth-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-auth-service:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push clinic service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/clinic-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-clinic-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-clinic-service:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push patient service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/patient-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-patient-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-patient-service:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push appointment service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/appointment-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-appointment-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-appointment-service:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push treatment service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/treatment-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-treatment-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-treatment-service:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push API gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-api-gateway:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-api-gateway:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/dentiflow-frontend:latest
          build-args: |
            PNPM_FLAGS=--frozen-lockfile
            PROD_PNPM_FLAGS=--frozen-lockfile
            NEXT_PUBLIC_API_URL=${{ env.PROD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DEFAULT_CLINIC_ID=${{ env.PROD_NEXT_PUBLIC_DEFAULT_CLINIC_ID }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: docker-compose.deploy.yml
          target: /opt/dentiflow

      - name: Pull and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd /opt/dentiflow
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            docker compose --env-file .env.prod -f docker-compose.deploy.yml pull
            docker compose --env-file .env.prod -f docker-compose.deploy.yml rm -f db-bootstrap auth-migrations clinic-migrations patient-migrations appointment-migrations treatment-migrations || true
            if ! docker compose --env-file .env.prod -f docker-compose.deploy.yml up -d --no-build --remove-orphans; then
              docker compose --env-file .env.prod -f docker-compose.deploy.yml ps -a
              docker compose --env-file .env.prod -f docker-compose.deploy.yml logs --no-color db db-bootstrap auth-migrations clinic-migrations patient-migrations appointment-migrations treatment-migrations
              exit 1
            fi
            docker image prune -af --filter "until=168h"
